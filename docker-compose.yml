version: '3.8'

services: 
    inference_api:
      build: .
      ports: 
        - "3000:3000"
      environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - MODEL_NAME=${MODEL_NAME}
      volumes:
      - ./models:/app/models
      restart: unless-stopped
    redis:
      image: "redis:alpine"